# Serve o build estático do Vite e faz proxy de /api e /static para o
# backend — mesmo padrão do proxy de dev em vite.config.ts, para o
# frontend falar com o backend em same-origin (sem precisar de CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Os arquivos de /assets carregam hash do conteudo no nome, entao
    # podem ser cacheados para sempre: um build novo gera nomes novos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html e o oposto: e ele que aponta para o bundle com hash.
    # Sem no-cache o navegador o guarda por heuristica (nao ha
    # Cache-Control, so Last-Modified), e o visitante que ja abriu o site
    # antes segue carregando o bundle velho depois de um deploy — ou toma
    # 404, quando o arquivo antigo nao existe mais.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router cuida do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
