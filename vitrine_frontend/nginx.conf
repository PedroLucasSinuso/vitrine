# Serve o build estático do Vite e faz proxy de /api e /static para o
# backend — mesmo padrão do proxy de dev em vite.config.ts, para o
# frontend falar com o backend em same-origin (sem precisar de CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router cuida do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
