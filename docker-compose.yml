# Uso:
#   cp vitrine_backend/.env.example vitrine_backend/.env
#   docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: vitrine_backend/Dockerfile
    env_file:
      - ./vitrine_backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER:-vitrine}:${POSTGRES_APP_PASSWORD:-vitrine}@db:5432/${POSTGRES_APP_DB:-vitrine}
      # O container nasce em UTC, e todo o corte de data do BI usa a data
      # local do servidor (`date.today()`). Sem isto, das 21h em diante o
      # backend já virou o dia e "hoje" deixa de ser o dia da loja.
      # Sobrescreva por TZ no .env se o cliente estiver em outro fuso.
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - vitrine_backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER:-vitrine}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-vitrine}
      POSTGRES_DB: ${POSTGRES_APP_DB:-vitrine}
    volumes:
      - vitrine_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./vitrine_frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  vitrine_backend_data:
  vitrine_db_data:
