name: CI

# Espelha exatamente os checks do .githooks/pre-commit local, para que
# nada que passaria no commit local possa falhar silenciosamente aqui —
# e vice-versa.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitrine_backend
    steps:
      - uses: actions/checkout@v4

      - name: Instala dependências de sistema (psycopg2, WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-dejavu-core

      - name: Instala uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Testes (pytest)
        env:
          JWT_SECRET: ci-chave-de-teste-com-mais-de-32-caracteres
          ALLOWED_ORIGINS: '["http://localhost:5173"]'
          SQLITE_URL: sqlite:///./data/ci_test.db
        run: |
          # data/ e' gitignored, entao nao existe no checkout — o SQLITE_URL
          # acima aponta para dentro dele e a suite quebra na coleta sem isso.
          mkdir -p data
          # Chave Fernet efemera: sem ela os testes de criptografia de
          # configuracao falham (nao ha default seguro em CI).
          export ERPS_ENCRYPTION_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitrine_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vitrine_frontend/package-lock.json

      - run: npm ci

      - name: TypeScript (noEmit)
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Testes (vitest)
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./vitrine_backend
          push: false

      - name: Build imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./vitrine_frontend
          push: false
